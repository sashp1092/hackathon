version: '3.8'
services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.nginx
    ports:
      - "9999:80"
    volumes:
      # ВАЖНО: Мы берем твою локальную папку public 
      # и кладем её ровно туда, откуда Nginx читает файлы
      - ./public:/usr/share/nginx/html
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: php/Dockerfile.php
    volumes:
      - .:/var/www/html

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./mysql:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} # Берем пароль из .env, чтобы не было путаницы
    depends_on:
      - mysql
